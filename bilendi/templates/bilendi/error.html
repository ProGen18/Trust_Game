<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès refusé</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f0eb;
        }
        .container {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 480px;
            text-align: center;
        }
        h1 { font-size: 1.3rem; color: #3a2f28; margin-bottom: 1rem; }
        p { color: #5c4a3a; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ message }}</h1>
        <p>Si vous pensez qu'il s'agit d'une erreur, veuillez contacter l'équipe de recherche.</p>
    </div>
</body>
</html>
