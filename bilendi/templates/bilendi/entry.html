<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès à l'étude</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f0eb;
        }
        .container {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 480px;
            text-align: center;
        }
        h1 { font-size: 1.3rem; color: #3a2f28; margin-bottom: 1rem; }
        p { color: #5c4a3a; line-height: 1.6; margin-bottom: 1.5rem; }
        .spinner {
            display: inline-block;
            width: 32px; height: 32px;
            border: 3px solid #e0d5c7;
            border-top-color: #8b6914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #c0392b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Accès à l'étude en cours...</h1>
        <p>Vous allez être redirigé automatiquement. Veuillez patienter.</p>
        <noscript>
            <p class="error">JavaScript est requis pour accéder à cette étude. Veuillez l'activer.</p>
        </noscript>
    </div>
    <form id="auto-submit" method="POST" style="display:none;">
        <input type="hidden" name="token" id="token-input">
        <input type="hidden" name="csrfmiddlewaretoken" value="">
    </form>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var token = params.get("token");
            if (!token) {
                document.querySelector(".spinner").style.display = "none";
                document.querySelector("h1").textContent = "Lien invalide";
                document.querySelector("p").textContent = "Ce lien ne contient pas de paramètre d'accès valide.";
                return;
            }
            var form = document.getElementById("auto-submit");
            document.getElementById("token-input").value = token;
            var csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
            csrfInput.value = "{{ csrf_token }}";
            form.submit();
        })();
    </script>
</body>
</html>
