{% extends "admin/base_site.html" %}
{% block content %}
<h1>Import whitelist Bilendi</h1>
<p>Sélectionnez un fichier CSV avec une colonne <code>bilendi_id</code>.</p>
<p>Formats acceptés : séparateur virgule ou point-virgule, encodage UTF-8 ou Latin-1.</p>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="whitelist_csv" accept=".csv" required>
    <input type="submit" value="Importer">
</form>
<hr>
<p><a href="../">← Retour à la liste</a></p>
{% endblock %}
